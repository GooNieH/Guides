name: Customize sidebar menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/customize-sidebar-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  customize-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tooling
        run: python -m pip install --quiet pillow numpy

      - name: Fetch pristine classic menu artwork
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/classic-menu
          for item in news basics classes skills items monsters npcs quests shrines maps faq files; do
            for state in off ovr act; do
              curl -fsSL \
                "https://classic.battle.net/images/battle/diablo2exp/images/menu/menu-${item}-${state}.gif" \
                -o "/tmp/classic-menu/menu-${item}-${state}.gif"
            done
          done

      - name: Rebuild NEWS as SP CALCULATOR from original Diablo II letter cells
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageFilter

          SRC = Path('/tmp/classic-menu')
          OUT = Path('images/battle/diablo2exp/images/menu')
          TARGET = 'SP CALCULATOR'

          labels = {
              'news': 'NEWS',
              'basics': 'BASICS',
              'classes': 'CLASSES',
              'skills': 'SKILLS',
              'items': 'ITEMS',
              'monsters': 'MONSTERS',
              'npcs': 'NPCS',
              'quests': 'QUESTS',
              'shrines': 'SHRINES',
              'maps': 'MAPS',
              'faq': 'FAQ',
              'files': 'FILES',
          }

          source_for = {
              'S': ('files', 4),
              'P': ('maps', 2),
              'C': ('npcs', 2),
              'A': ('maps', 1),
              'L': ('files', 2),
              'U': ('quests', 1),
              'T': ('items', 1),
              'O': ('monsters', 1),
              'R': ('shrines', 2),
          }

          RX0, RY0, RX1, RY1 = 16, 10, 98, 27
          RH, RW = RY1 - RY0, RX1 - RX0

          def arr(path):
              return np.asarray(Image.open(path).convert('RGB'), dtype=np.int16)

          images = {
              state: {
                  key: arr(SRC / f'menu-{key}-{state}.gif')
                  for key in labels
              }
              for state in ('off', 'ovr', 'act')
          }

          blanks = {}
          for state in ('off', 'ovr', 'act'):
              regions = [
                  img[RY0:RY1, RX0:RX1]
                  for img in images[state].values()
              ]
              blanks[state] = np.median(np.stack(regions), axis=0).astype(np.uint8)

          def overall_bounds(button):
              region = images['off'][button][RY0:RY1, RX0:RX1]
              bg = blanks['off'].astype(np.int16)
              diff = np.max(np.abs(region - bg), axis=2)
              mask = diff >= 48
              col_counts = mask.sum(axis=0)
              active = np.where(col_counts >= 2)[0]
              if len(active) == 0:
                  raise RuntimeError(f'No text span detected for {button}')
              x0, x1 = int(active.min()), int(active.max()) + 1
              n = len(labels[button])
              pitch = (x1 - x0) / n
              return x0, x1, pitch

          spans = {button: overall_bounds(button) for button in labels}

          def clean_off_mask(button, index):
              x0, x1, pitch = spans[button]
              ca = int(round(x0 + index * pitch))
              cb = int(round(x0 + (index + 1) * pitch))
              ca = max(0, ca - 1)
              cb = min(RW, cb + 1)

              region = images['off'][button][RY0:RY1, RX0:RX1]
              bg = blanks['off'].astype(np.int16)
              diff = np.max(np.abs(region - bg), axis=2)
              m = (diff[:, ca:cb] >= 48).astype(np.uint8) * 255

              pim = Image.fromarray(m, 'L')
              dil = np.asarray(pim.filter(ImageFilter.MaxFilter(3))) > 0
              ero = np.asarray(pim.filter(ImageFilter.MinFilter(3))) > 0
              core = np.asarray(pim) > 0
              keep = core & (dil | ero)

              ys, xs = np.where(keep)
              if len(xs) == 0:
                  raise RuntimeError(f'No glyph mask for {button}[{index}]')

              xa, xb = max(0, int(xs.min()) - 1), min(cb - ca, int(xs.max()) + 2)
              ya, yb = max(0, int(ys.min()) - 1), min(RH, int(ys.max()) + 2)
              return ca, cb, xa, xb, ya, yb, keep

          geometry = {
              ch: clean_off_mask(button, index)
              for ch, (button, index) in source_for.items()
          }

          def make_glyph(state, ch):
              button, index = source_for[ch]
              ca, cb, xa, xb, ya, yb, off_keep = geometry[ch]

              region = images[state][button][RY0:RY1, RX0:RX1]
              bg = blanks[state].astype(np.int16)
              state_diff = np.max(np.abs(region - bg), axis=2)
              state_mask = state_diff[:, ca:cb] >= 24

              off_mask = off_keep
              dilated = np.asarray(
                  Image.fromarray((off_mask * 255).astype(np.uint8), 'L')
                  .filter(ImageFilter.MaxFilter(3))
              ) > 0
              mask = off_mask | (state_mask & dilated)

              patch = region[ya:yb, ca+xa:ca+xb].astype(np.uint8)
              pmask = mask[ya:yb, xa:xb]
              return patch, pmask, ya

          def make_state(state):
              news_path = SRC / f'menu-news-{state}.gif'
              original_news = Image.open(news_path)
              base = np.asarray(original_news.convert('RGB'), dtype=np.uint8).copy()
              base[RY0:RY1, RX0:RX1] = blanks[state]

              pieces = []
              total_w = 0
              gap = 1
              space_w = 3

              for ch in TARGET:
                  if ch == ' ':
                      pieces.append((None, None, None, space_w))
                      total_w += space_w
                  else:
                      patch, pmask, y = make_glyph(state, ch)
                      w = patch.shape[1]
                      pieces.append((patch, pmask, y, w))
                      total_w += w
                  total_w += gap
              total_w -= gap

              layer = np.zeros((RH, total_w, 3), dtype=np.uint8)
              alpha = np.zeros((RH, total_w), dtype=np.uint8)

              x = 0
              for patch, pmask, y, w in pieces:
                  if patch is None:
                      x += w + gap
                      continue
                  h = patch.shape[0]
                  py = max(0, min(RH - h, y))
                  layer[py:py+h, x:x+w] = patch
                  alpha[py:py+h, x:x+w][pmask] = 255
                  x += w + gap

              max_w = RW - 4
              layer_img = Image.fromarray(layer, 'RGB')
              alpha_img = Image.fromarray(alpha, 'L')
              if total_w > max_w:
                  new_w = max_w
                  layer_img = layer_img.resize((new_w, RH), Image.Resampling.NEAREST)
                  alpha_img = alpha_img.resize((new_w, RH), Image.Resampling.NEAREST)

              result = Image.fromarray(base, 'RGB')
              paste_x = (116 - layer_img.width) // 2
              result.paste(layer_img, (paste_x, RY0), alpha_img)

              result = result.quantize(
                  palette=original_news.convert('P'),
                  dither=Image.Dither.NONE
              )
              out_path = OUT / f'menu-news-{state}.gif'
              result.save(out_path, format='GIF', optimize=False)
              print(f'{state}: {out_path} text={layer_img.width}px')

          for state in ('off', 'ovr', 'act'):
              make_state(state)
          PY

      - name: Commit customized menu artwork
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/battle/diablo2exp/images/menu/menu-news-*.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Rebuild SP Calculator from classic Diablo II glyphs'
          git push
