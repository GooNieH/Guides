name: Customize sidebar menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/customize-sidebar-menu.yml'
      - 'assets/sidebar/sp-calculator-*.gif'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  customize-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SP Calculator button states
        shell: bash
        run: |
          set -euxo pipefail
          menu='images/battle/diablo2exp/images/menu'
          mkdir -p "$menu"
          cp assets/sidebar/sp-calculator-off.gif "$menu/menu-news-off.gif"
          cp assets/sidebar/sp-calculator-ovr.gif "$menu/menu-news-ovr.gif"
          cp assets/sidebar/sp-calculator-act.gif "$menu/menu-news-act.gif"

      - name: Commit customized menu artwork
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/battle/diablo2exp/images/menu/menu-news-*.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Install SP Calculator button artwork'
          git push
