name: Customize sidebar menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/customize-sidebar-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  customize-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tooling
        run: python -m pip install --quiet pillow numpy

      - name: Fetch pristine classic menu artwork
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/classic-menu
          for item in news basics classes skills items monsters npcs quests shrines maps faq files; do
            for state in off ovr act; do
              curl -fsSL \
                "https://classic.battle.net/images/battle/diablo2exp/images/menu/menu-${item}-${state}.gif" \
                -o "/tmp/classic-menu/menu-${item}-${state}.gif"
            done
          done

      - name: Rebuild NEWS as SP CALCULATOR from original Diablo II letterforms
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import numpy as np
          from PIL import Image

          SRC = Path('/tmp/classic-menu')
          OUT = Path('images/battle/diablo2exp/images/menu')
          TARGET = 'SP CALCULATOR'

          labels = {
              'news': 'NEWS',
              'basics': 'BASICS',
              'classes': 'CLASSES',
              'skills': 'SKILLS',
              'items': 'ITEMS',
              'monsters': 'MONSTERS',
              'npcs': 'NPCS',
              'quests': 'QUESTS',
              'shrines': 'SHRINES',
              'maps': 'MAPS',
              'faq': 'FAQ',
              'files': 'FILES',
          }

          RX0, RY0, RX1, RY1 = 12, 9, 104, 28

          def rgb(path):
              return np.asarray(Image.open(path).convert('RGB'), dtype=np.int16)

          def active_runs(mask):
              cols = mask.any(axis=0)
              runs = []
              start = None
              for x, on in enumerate(cols):
                  if on and start is None:
                      start = x
                  elif not on and start is not None:
                      runs.append((start, x))
                      start = None
              if start is not None:
                  runs.append((start, len(cols)))
              return runs

          def make_state(state):
              originals = {
                  key: rgb(SRC / f'menu-{key}-{state}.gif')
                  for key in labels
              }

              regions = {
                  key: img[RY0:RY1, RX0:RX1]
                  for key, img in originals.items()
              }
              stack = np.stack(list(regions.values()), axis=0)
              blank_region = np.median(stack, axis=0).astype(np.uint8)

              news_path = SRC / f'menu-news-{state}.gif'
              original_news = Image.open(news_path)
              base = np.asarray(original_news.convert('RGB'), dtype=np.uint8).copy()
              base[RY0:RY1, RX0:RX1] = blank_region

              glyphs = defaultdict(list)
              diagnostics = []

              for key, label in labels.items():
                  img = originals[key]
                  region = regions[key]
                  bg = blank_region.astype(np.int16)
                  diff = np.max(np.abs(region.astype(np.int16) - bg), axis=2)
                  mask = diff >= 24
                  col_counts = mask.sum(axis=0)
                  mask[:, col_counts < 2] = False

                  runs = active_runs(mask)
                  chars = [c for c in label if c != ' ']
                  while len(runs) > len(chars):
                      gaps = [runs[i+1][0] - runs[i][1] for i in range(len(runs)-1)]
                      j = int(np.argmin(gaps))
                      runs[j:j+2] = [(runs[j][0], runs[j+1][1])]

                  diagnostics.append(f'{state} {key}: runs={len(runs)} chars={len(chars)} {runs}')
                  if len(runs) != len(chars):
                      continue

                  for ch, (xa, xb) in zip(chars, runs):
                      submask = mask[:, xa:xb]
                      ys, xs = np.where(submask)
                      if len(xs) == 0:
                          continue
                      ya, yb = int(ys.min()), int(ys.max()) + 1
                      xa2, xb2 = int(xs.min()), int(xs.max()) + 1
                      patch = region[ya:yb, xa+xa2:xa+xb2].astype(np.uint8)
                      pmask = submask[ya:yb, xa2:xb2]
                      glyphs[ch].append((patch, pmask))

              required = set(TARGET.replace(' ', ''))
              missing = sorted(required - set(glyphs))
              print('\n'.join(diagnostics))
              if missing:
                  raise SystemExit(f'Missing extracted glyphs for state {state}: {missing}')

              chosen = {ch: glyphs[ch][0] for ch in required}
              gap = 1
              space = 4
              pieces = []
              total_w = 0
              for ch in TARGET:
                  if ch == ' ':
                      pieces.append((None, None, space))
                      total_w += space
                  else:
                      patch, pmask = chosen[ch]
                      w = patch.shape[1]
                      pieces.append((patch, pmask, w))
                      total_w += w
                  total_w += gap
              total_w -= gap

              max_w = RX1 - RX0 - 6
              scale = min(1.0, max_w / total_w)
              canvas_h = RY1 - RY0
              text_layer = np.zeros((canvas_h, total_w, 3), dtype=np.uint8)
              alpha = np.zeros((canvas_h, total_w), dtype=np.uint8)

              x = 0
              baseline = 15
              for patch, pmask, w in pieces:
                  if patch is None:
                      x += w + gap
                      continue
                  h = patch.shape[0]
                  y = max(0, min(canvas_h - h, baseline - h))
                  text_layer[y:y+h, x:x+w] = patch
                  alpha[y:y+h, x:x+w][pmask] = 255
                  x += w + gap

              layer_img = Image.fromarray(text_layer, 'RGB')
              alpha_img = Image.fromarray(alpha, 'L')
              if scale < 1.0:
                  new_w = max(1, int(round(total_w * scale)))
                  layer_img = layer_img.resize((new_w, canvas_h), Image.Resampling.NEAREST)
                  alpha_img = alpha_img.resize((new_w, canvas_h), Image.Resampling.NEAREST)

              result = Image.fromarray(base, 'RGB')
              x0 = (116 - layer_img.width) // 2
              result.paste(layer_img, (x0, RY0), alpha_img)

              palette = original_news.convert('P')
              result = result.quantize(palette=palette, dither=Image.Dither.NONE)
              out_path = OUT / f'menu-news-{state}.gif'
              result.save(out_path, format='GIF', optimize=False)
              print(f'wrote {out_path}: {result.size}, text_width={layer_img.width}px')

          for state in ('off', 'ovr', 'act'):
              make_state(state)
          PY

      - name: Commit customized menu artwork
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/battle/diablo2exp/images/menu/menu-news-*.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Match SP Calculator button to classic menu lettering'
          git push
