name: Fetch original Arreat Summit assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-arreat-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original homepage and artwork
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets/headers reference
          curl -fL --retry 3 --user-agent 'Mozilla/5.0' \
            'https://classic.battle.net/diablo2exp/' \
            -o reference/original-index.html
          curl -fL --retry 3 --user-agent 'Mozilla/5.0' \
            'https://classic.battle.net/images/battle/diablo2exp/images/arreat-summit.gif' \
            -o assets/arreat-summit.gif
          curl -fL --retry 3 --user-agent 'Mozilla/5.0' \
            'https://classic.battle.net/images/battle/diablo2exp/images/headers/header-left.gif' \
            -o assets/headers/header-left.gif
          curl -fL --retry 3 --user-agent 'Mozilla/5.0' \
            'https://classic.battle.net/images/battle/diablo2exp/images/headers/news-news.gif' \
            -o assets/headers/news-news.gif
          curl -fL --retry 3 --user-agent 'Mozilla/5.0' \
            'https://classic.battle.net/images/battle/diablo2exp/images/headers/header-right.gif' \
            -o assets/headers/header-right.gif

      - name: Commit fetched files
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets reference/original-index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add original Arreat Summit homepage assets'
          git push
