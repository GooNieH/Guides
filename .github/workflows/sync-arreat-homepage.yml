name: Build faithful Arreat Summit homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-arreat-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the original homepage and its page assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf mirror
          mkdir -p mirror
          wget \
            --page-requisites \
            --no-host-directories \
            --directory-prefix=mirror \
            --execute robots=off \
            --user-agent='Mozilla/5.0' \
            'https://classic.battle.net/diablo2exp/'

          # Preserve the original directory structure so the old root-relative
          # image, CSS and JS paths continue to work on Cloudflare Pages.
          rsync -a mirror/ ./
          cp mirror/diablo2exp/index.html index.html

      - name: Hide only text inside the black content panel
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8', errors='replace')
          css = r'''
          <style id="guides-black-panel-text-removal">
            /* Preserve the original Arreat Summit layout and artwork.
               Only text inside the central black content panel is hidden. */
            td[background*="blackbg.gif"],
            td[background*="blackbg.gif"] * {
              color: transparent !important;
              text-decoration-color: transparent !important;
              text-shadow: none !important;
            }
            td[background*="blackbg.gif"] li::marker {
              color: transparent !important;
            }
            td[background*="blackbg.gif"] img {
              visibility: visible !important;
              opacity: 1 !important;
            }
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit the faithful local mirror
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf mirror
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html diablo2exp images includes 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Mirror original Arreat Summit homepage and hide black-panel text'
          git push
