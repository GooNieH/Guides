name: Build faithful Arreat Summit homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-arreat-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the original homepage and its page assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf mirror
          mkdir -p mirror
          wget \
            --page-requisites \
            --no-host-directories \
            --directory-prefix=mirror \
            --execute robots=off \
            --user-agent='Mozilla/5.0' \
            'https://classic.battle.net/diablo2exp/'

          # Preserve the original directory structure so the old root-relative
          # image, CSS and JS paths continue to work on Cloudflare Pages.
          rsync -a mirror/ ./
          cp mirror/diablo2exp/index.html index.html

      - name: Fetch JavaScript rollover artwork
        shell: bash
        run: |
          set -euxo pipefail

          # wget only sees assets referenced directly by HTML/CSS. The original
          # menu rollover artwork is referenced dynamically from d2.js, so fetch
          # every image path declared there as well. This keeps the original
          # mouse-over effect without broken-image/ALT-text flashes.
          grep -oE '"/[^" ]+\.(gif|jpg|jpeg|png)"' diablo2exp/includes/d2.js \
            | tr -d '"' \
            | sort -u \
            | while read -r asset; do
                target="${asset#/}"
                mkdir -p "$(dirname "$target")"
                curl -fsSL "https://classic.battle.net${asset}" -o "$target"
              done

      - name: Apply requested visual cleanup
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          page_css = r'''
          <style id="guides-homepage-cleanup">
            /* Visually clear the original central black content panel. */
            td[background*="blackbg.gif"],
            td[background*="blackbg.gif"] * {
              color: transparent !important;
              text-decoration-color: transparent !important;
              text-shadow: none !important;
            }
            td[background*="blackbg.gif"] li::marker {
              color: transparent !important;
            }
            td[background*="blackbg.gif"] img {
              visibility: visible !important;
              opacity: 1 !important;
            }

            /* Remove the old Arreat Summit logo + barbarian while preserving
               their dimensions so the surrounding frame does not shift. */
            td[background*="blackbg.gif"] img[src*="arreat-summit.gif"],
            td[background*="blackbg.gif"] img[src*="chaos-barbhireable.gif"] {
              visibility: hidden !important;
            }

            /* Remove only the inner gold advertising rectangles and ad image.
               Keep ad-back.gif plus the left/right border artwork intact so
               the textured header and ornate end caps remain unchanged. */
            img[src*="ad-top.gif"],
            img[src*="ad-left.gif"],
            img[src*="ad-right.gif"],
            img[src*="ad-bot.gif"],
            img[src*="/images/ads/"] {
              visibility: hidden !important;
            }
          </style>
          '''

          for p in (Path('index.html'), Path('diablo2exp/index.html')):
              html = p.read_text(encoding='utf-8', errors='replace')
              html = html.replace('</head>', page_css + '\n</head>', 1)
              p.write_text(html, encoding='utf-8')

          # Every classic guide page loads this shared stylesheet. Keep all
          # site-wide removals here so individual guide pages stay untouched.
          shared_css = Path('diablo2exp/includes/d2-strat.css')
          css = shared_css.read_text(encoding='utf-8', errors='replace')

          ribbon_marker = '/* Guides: remove only the three cells that form classic section-title ribbons. */'
          if ribbon_marker not in css:
              css += r'''

          /* Guides: remove only the three cells that form classic section-title ribbons. */
          td[background*="/headers/header-back.gif"] {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            padding: 0 !important;
            line-height: 0 !important;
            font-size: 0 !important;
            background: none !important;
          }
          '''

          chrome_marker = '/* Guides: remove legacy chrome while keeping the future logo slot. */'
          if chrome_marker not in css:
              css += r'''

          /* Guides: remove legacy chrome while keeping the future logo slot. */
          /* Image 2: remove the 18px global Battle.net/game strip and reclaim its space. */
          body > table[height="18"][width="100%"] {
            display: none !important;
          }

          /* Image 3: hide only the Diablo II Expansion artwork; keep its 116x82 slot. */
          img[name="logo"][src*="d2-logo-"] {
            visibility: hidden !important;
          }

          /* Image 4: remove only the sidebar cell containing the lower Battle.net logo. */
          td:has(> a > img[src$="/blizz-logo.gif"]) {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            padding: 0 !important;
          }

          /* Image 1: remove only the cell containing the Exit/close button. */
          td:has(> br + a > img[name="exit"]),
          td:has(> a > img[name="exit"]) {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            padding: 0 !important;
          }
          '''

          shared_css.write_text(css, encoding='utf-8')
          PY

      - name: Commit the faithful local mirror
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf mirror
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html diablo2exp images includes 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Apply cleaned guide chrome and reserved logo slot'
          git push