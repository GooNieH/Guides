name: Build faithful Arreat Summit homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-arreat-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the original homepage and its page assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf mirror
          mkdir -p mirror
          wget \
            --page-requisites \
            --no-host-directories \
            --directory-prefix=mirror \
            --execute robots=off \
            --user-agent='Mozilla/5.0' \
            'https://classic.battle.net/diablo2exp/'

          # Preserve the original directory structure so the old root-relative
          # image, CSS and JS paths continue to work on Cloudflare Pages.
          rsync -a mirror/ ./
          cp mirror/diablo2exp/index.html index.html

      - name: Fetch JavaScript rollover artwork
        shell: bash
        run: |
          set -euxo pipefail

          # wget only sees assets referenced directly by HTML/CSS. The original
          # menu rollover artwork is referenced dynamically from d2.js, so fetch
          # every image path declared there as well. This keeps the original
          # mouse-over effect without broken-image/ALT-text flashes.
          grep -oE '"/[^" ]+\.(gif|jpg|jpeg|png)"' diablo2exp/includes/d2.js \
            | tr -d '"' \
            | sort -u \
            | while read -r asset; do
                target="${asset#/}"
                mkdir -p "$(dirname "$target")"
                curl -fsSL "https://classic.battle.net${asset}" -o "$target"
              done

      - name: Apply requested visual cleanup without moving the layout
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8', errors='replace')
          css = r'''
          <style id="guides-homepage-cleanup">
            /* Hide only text inside the original central black content panel. */
            td[background*="blackbg.gif"],
            td[background*="blackbg.gif"] * {
              color: transparent !important;
              text-decoration-color: transparent !important;
              text-shadow: none !important;
            }
            td[background*="blackbg.gif"] li::marker {
              color: transparent !important;
            }
            td[background*="blackbg.gif"] img {
              visibility: visible !important;
              opacity: 1 !important;
            }

            /* Remove the Arreat Summit logo + barbarian shown in image 2,
               but preserve their original dimensions so nothing shifts. */
            td[background*="blackbg.gif"] img[src*="arreat-summit.gif"],
            td[background*="blackbg.gif"] img[src*="chaos-barbhireable.gif"] {
              visibility: hidden !important;
            }

            /* Remove the gold advertising boxes shown in image 3 while
               preserving the original 75px header spacing/layout. */
            td[background*="ad-back.gif"] {
              background-image: none !important;
            }
            img[src*="ad-leftborder.gif"],
            img[src*="ad-rightborder.gif"],
            img[src*="ad-top.gif"],
            img[src*="ad-left.gif"],
            img[src*="ad-right.gif"],
            img[src*="ad-bot.gif"],
            img[src*="/images/ads/"] {
              visibility: hidden !important;
            }
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit the faithful local mirror
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf mirror
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html diablo2exp images includes 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix menu rollovers and remove requested homepage artwork'
          git push
