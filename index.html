<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Arreat Summit</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .arreat-page {
      position: relative;
      width: 100vw;
      line-height: 0;
      background: #000;
    }

    .arreat-page img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /*
      The supplied reference image is left untouched. These two pure-black
      overlays only hide the text that appears in the black content areas.
      The Arreat Summit logo and the original NEWS artwork remain unchanged.
    */
    .text-mask {
      position: absolute;
      left: 0;
      width: 100%;
      background: #000;
      pointer-events: none;
    }

    .text-mask--top {
      top: 15.92%;
      height: 37.80%;
    }

    .text-mask--bottom {
      top: 64.32%;
      bottom: 0;
    }
  </style>
</head>
<body>
  <main class="arreat-page" aria-label="The Arreat Summit visual layout">
    <img src="assets/arreat-reference.png" alt="" aria-hidden="true">
    <div class="text-mask text-mask--top" aria-hidden="true"></div>
    <div class="text-mask text-mask--bottom" aria-hidden="true"></div>
  </main>
</body>
</html>
