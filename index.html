<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Arreat Summit</title>
  <meta name="theme-color" content="#000000">
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      background: #000;
      overflow: hidden;
    }

    .hero {
      height: 410px;
      position: relative;
    }

    .logo {
      display: block;
      width: auto;
      height: auto;
      max-width: 90vw;
      margin: 14px auto 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    .news-bar {
      display: flex;
      width: 100%;
      height: 72px;
      overflow: hidden;
      line-height: 0;
      background: #000;
    }

    .news-bar img {
      display: block;
      height: 72px;
      user-select: none;
      -webkit-user-drag: none;
    }

    .news-bar__cap {
      flex: 0 0 auto;
      width: auto;
    }

    .news-bar__center {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
    }

    .empty-content {
      min-height: calc(100vh - 482px);
      background: #000;
    }

    @media (max-width: 700px) {
      .hero { height: 300px; }
      .news-bar,
      .news-bar img { height: 54px; }
      .empty-content { min-height: calc(100vh - 354px); }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="The Arreat Summit layout">
    <section class="hero" aria-hidden="true">
      <img
        class="logo"
        src="https://classic.battle.net/images/battle/diablo2exp/images/arreat-summit.gif"
        alt=""
      >
    </section>

    <div class="news-bar" aria-hidden="true">
      <img
        class="news-bar__cap"
        src="https://classic.battle.net/images/battle/diablo2exp/images/headers/header-left.gif"
        alt=""
      >
      <img
        class="news-bar__center"
        src="https://classic.battle.net/images/battle/diablo2exp/images/headers/news-news.gif"
        alt=""
      >
      <img
        class="news-bar__cap"
        src="https://classic.battle.net/images/battle/diablo2exp/images/headers/header-right.gif"
        alt=""
      >
    </div>

    <section class="empty-content" aria-hidden="true"></section>
  </main>
</body>
</html>
